AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: An AWS Serverless Specification template describing your function.
Resources:
  VisitorsCounts:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: VisitorsCounts
      AttributeDefinitions:
        - AttributeName: count
          AttributeType: S
      KeySchema:
        - AttributeName: count
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  visitorcount:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.7
      CodeUri: .
      Description: ''
      Events:
        Api1:
          Type: Api
          Properties:
            Path: /visitors
            Method: GET
      Environment:
        Variables: 
          TABLE_NAME: !Ref VisitorsCounts
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorsCounts
Outputs:
  LambdaFunctionApi:
    Description: ''
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/visitors"